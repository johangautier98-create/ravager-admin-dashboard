<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVAGER Admin</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3e;--accent:#e8a020;--text:#e2e8f0;--muted:#64748b;--danger:#ef4444;--success:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
.gate-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;text-align:center}
.gate-card h1{font-size:24px;margin-bottom:8px}
.gate-card p{color:var(--muted);margin-bottom:24px;font-size:14px}
input[type=password],input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:14px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-copy{background:#1e293b;border:1px solid var(--border);color:var(--text)}
#app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card)}
.logo{font-size:18px;font-weight:700}
#app-body{padding:24px;max-width:1200px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:28px;font-weight:700;margin-top:4px}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px}
.matrix-wrapper{overflow-x:auto}
.matrix-table{border-collapse:separate;border-spacing:6px}
.matrix-table th{font-size:13px;font-weight:600;padding:8px 16px;text-align:center;color:var(--muted);white-space:nowrap}
.matrix-table td{padding:0}
.color-th-inner{display:flex;align-items:center;justify-content:center;gap:6px}
.color-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.matrix-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s;width:100%;min-width:90px}
.matrix-cell:hover{border-color:var(--accent);transform:translateY(-2px)}
.matrix-cell.empty{opacity:.25;cursor:default;pointer-events:none}
.cell-count{font-size:26px;font-weight:700;line-height:1}
.cell-count.hot{color:var(--accent)}
.cell-label{font-size:11px;color:var(--muted);margin-top:4px}
.size-label{font-size:15px;font-weight:600;text-align:right;padding-right:10px;white-space:nowrap;color:var(--text)}
dialog{background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);max-width:580px;width:92vw;padding:0}
dialog::backdrop{background:rgba(0,0,0,.75)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:20px;font-weight:700}
.modal-sub{font-size:13px;color:var(--muted);margin-top:3px}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 0 0 12px;flex-shrink:0}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.block-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.customer-list{background:var(--bg);border:1px solid var(--border);border-radius:8px;max-height:180px;overflow-y:auto}
.customer-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;gap:12px}
.customer-row:last-child{border-bottom:none}
.c-name{font-weight:500;white-space:nowrap}
.c-email{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcc-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--muted);word-break:break-all;max-height:60px;overflow-y:auto;line-height:1.6}
.tpl-box{position:relative}
.tpl-box textarea{min-height:160px;resize:vertical;font-size:13px;line-height:1.7}
#toast{position:fixed;bottom:24px;right:24px;background:var(--success);color:#000;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999}
#toast.show{opacity:1}
.empty-state{text-align:center;padding:48px;color:var(--muted)}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1><span style="color:#e8a020">RAVAGER</span> Admin</h1>
    <p>Gestion des demandes de réassort</p>
    <input type="password" id="pw" placeholder="Mot de passe" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pw-err" style="color:#ef4444;font-size:13px;margin-bottom:12px;min-height:18px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="checkPw()">Accéder</button>
  </div>
</div>

<div id="app" hidden>
  <header id="app-header">
    <div class="logo"><span style="color:#e8a020">RAVAGER</span> Admin &mdash; Réassorts</div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost" onclick="loadData()">&#x21BA; Actualiser</button>
      <button class="btn btn-ghost" onclick="logout()">Déconnexion</button>
    </div>
  </header>
  <div id="app-body">
    <div id="stats" class="stats-grid"></div>
    <div class="section-title">Demandes par taille et coloris — cliquer sur une case</div>
    <div class="matrix-wrapper" id="matrix"></div>
  </div>
</div>

<dialog id="dlg">
  <div class="modal-header">
    <div>
      <div class="modal-title" id="dlg-title"></div>
      <div class="modal-sub" id="dlg-sub"></div>
    </div>
    <button class="close-btn" onclick="document.getElementById('dlg').close()">&#x2715;</button>
  </div>
  <div class="modal-body">
    <div>
      <div class="block-label">Clients en attente</div>
      <div class="customer-list" id="dlg-customers"></div>
    </div>
    <div>
      <div class="block-label">Adresses email (BCC)</div>
      <div class="bcc-box" id="dlg-bcc"></div>
      <button class="btn btn-copy" style="margin-top:8px;font-size:13px" onclick="copyBcc()">&#x2398; Copier les emails BCC</button>
    </div>
    <div class="tpl-box">
      <div class="block-label">Email type &mdash; remplace [NOMBRE] avant d'envoyer</div>
      <textarea id="dlg-tpl"></textarea>
      <button class="btn btn-copy" style="margin-top:8px;font-size:13px" onclick="copyTpl()">&#x2398; Copier le message</button>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="document.getElementById('dlg').close()">Fermer</button>
    <button class="btn btn-danger" id="dlg-del">&#x1F5D1; Supprimer ces demandes</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
var SB_URL = 'https://xvyilbmlfvgriicpawex.supabase.co';
var SB_KEY = 'sb_publishable_-o9r10Tuo6Qu6v2xNkPLMQ_EL_xUpCF';
var PWD = 'ravager2026';
var data = [];
var curIds = [];

var COLORS = {
  'rose':['#f472b6','#f9a8d4'],'pink':['#f472b6','#f9a8d4'],
  'bleu':['#3b82f6','#93c5fd'],'blue':['#3b82f6','#93c5fd'],'chartreuse':['#3b82f6','#93c5fd'],
  'violet':['#8b5cf6','#c4b5fd'],'purple':['#8b5cf6','#c4b5fd'],
  'rouge':['#ef4444','#fca5a5'],'red':['#ef4444','#fca5a5'],
  'vert':['#22c55e','#86efac'],'green':['#22c55e','#86efac'],
  'jaune':['#f59e0b','#fcd34d'],'yellow':['#f59e0b','#fcd34d'],
  'orange':['#f97316','#fdba74'],
  'blanc':['#cbd5e1','#f1f5f9'],'white':['#cbd5e1','#f1f5f9'],
  'noir':['#475569','#94a3b8'],'black':['#475569','#94a3b8']
};

function getColor(c){
  var k=(c||'').toLowerCase();
  for(var n in COLORS){if(k.indexOf(n)>=0)return COLORS[n];}
  return['#64748b','#94a3b8'];
}

function checkPw(){
  if(document.getElementById('pw').value===PWD){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').hidden=false;
    loadData();
  } else {
    document.getElementById('pw-err').textContent='Mot de passe incorrect';
  }
}

function logout(){
  document.getElementById('gate').style.display='flex';
  document.getElementById('app').hidden=true;
  document.getElementById('pw').value='';
}

async function loadData(){
  var m=document.getElementById('matrix');
  m.textContent='';
  var loading=document.createElement('div');
  loading.className='empty-state';
  loading.textContent='Chargement...';
  m.appendChild(loading);
  try{
    var r=await fetch(SB_URL+'/rest/v1/restock_requests?notifie=eq.false&order=created_at.asc',{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    data=await r.json();
    renderStats();
    renderMatrix();
  }catch(e){
    m.textContent='';
    var err=document.createElement('div');
    err.className='empty-state';
    err.textContent='Erreur de connexion. Vérifie ta connexion internet.';
    m.appendChild(err);
  }
}

function renderStats(){
  var today=new Date().toISOString().slice(0,10);
  var todayN=data.filter(function(r){return r.created_at&&r.created_at.slice(0,10)===today;}).length;
  var colorsSet=new Set(data.map(function(r){return r.coloris;}));
  var combosSet=new Set(data.map(function(r){return r.taille+'|'+r.coloris;}));
  var items=[
    {label:'Total demandes',val:data.length},
    {label:'À notifier',val:data.length},
    {label:'Combos en rupture',val:combosSet.size},
    {label:"Aujourd'hui",val:todayN}
  ];
  var c=document.getElementById('stats');
  c.textContent='';
  items.forEach(function(s){
    var card=document.createElement('div');
    card.className='stat-card';
    var lbl=document.createElement('div');
    lbl.className='stat-label';
    lbl.textContent=s.label;
    var val=document.createElement('div');
    val.className='stat-value';
    val.textContent=s.val;
    card.appendChild(lbl);
    card.appendChild(val);
    c.appendChild(card);
  });
}

function renderMatrix(){
  var sizesSet=new Set();
  var colorsSet=new Set();
  data.forEach(function(r){
    if(r.taille)sizesSet.add(r.taille);
    if(r.coloris)colorsSet.add(r.coloris);
  });

  var sizes=[...sizesSet].sort(function(a,b){
    var na=parseInt((a||'').replace(/\D/g,''))||0;
    var nb=parseInt((b||'').replace(/\D/g,''))||0;
    return na-nb;
  });
  var colors=[...colorsSet].sort();

  var m=document.getElementById('matrix');
  m.textContent='';

  if(sizes.length===0){
    var es=document.createElement('div');
    es.className='empty-state';
    es.textContent='Aucune demande en attente. 🎉';
    m.appendChild(es);
    return;
  }

  var countMap={};
  data.forEach(function(r){
    var k=(r.taille||'')+'|||'+(r.coloris||'');
    countMap[k]=(countMap[k]||0)+1;
  });

  var tbl=document.createElement('table');
  tbl.className='matrix-table';

  // Header
  var thead=document.createElement('thead');
  var hrow=document.createElement('tr');
  var corner=document.createElement('th');
  corner.textContent='';
  hrow.appendChild(corner);

  colors.forEach(function(color){
    var th=document.createElement('th');
    var inner=document.createElement('div');
    inner.className='color-th-inner';
    var dot=document.createElement('span');
    dot.className='color-dot';
    dot.style.background=getColor(color)[0];
    inner.appendChild(dot);
    inner.appendChild(document.createTextNode(color));
    th.appendChild(inner);
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  // Body
  var tbody=document.createElement('tbody');
  sizes.forEach(function(size){
    var tr=document.createElement('tr');
    var sizeCell=document.createElement('td');
    sizeCell.className='size-label';
    sizeCell.textContent=size;
    tr.appendChild(sizeCell);

    colors.forEach(function(color){
      var k=size+'|||'+color;
      var cnt=countMap[k]||0;
      var td=document.createElement('td');
      var btn=document.createElement('button');
      btn.className='matrix-cell'+(cnt===0?' empty':'');

      var cntDiv=document.createElement('div');
      cntDiv.className='cell-count'+(cnt>0?' hot':'');
      cntDiv.textContent=cnt;

      var lblDiv=document.createElement('div');
      lblDiv.className='cell-label';
      lblDiv.textContent=cnt===1?'demande':'demandes';

      btn.appendChild(cntDiv);
      btn.appendChild(lblDiv);

      if(cnt>0){
        (function(s,c){
          btn.addEventListener('click',function(){openModal(s,c);});
        })(size,color);
      }
      td.appendChild(btn);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  m.appendChild(tbl);
}

function openModal(size, color){
  var customers=data.filter(function(r){return r.taille===size&&r.coloris===color;});
  curIds=customers.map(function(r){return r.id;});

  // Title
  var titleEl=document.getElementById('dlg-title');
  titleEl.textContent='';
  var dot=document.createElement('span');
  dot.className='color-dot';
  dot.style.background=getColor(color)[0];
  dot.style.marginRight='8px';
  dot.style.verticalAlign='middle';
  titleEl.appendChild(dot);
  titleEl.appendChild(document.createTextNode(size+' — '+color));

  var subEl=document.getElementById('dlg-sub');
  subEl.textContent=customers.length+' client'+(customers.length>1?'s':'')+' en attente';

  // Customer list
  var list=document.getElementById('dlg-customers');
  list.textContent='';
  customers.forEach(function(c){
    var row=document.createElement('div');
    row.className='customer-row';
    var nm=document.createElement('span');
    nm.className='c-name';
    nm.textContent=((c.prenom||'')+' '+(c.nom||'')).trim()||'—';
    var em=document.createElement('span');
    em.className='c-email';
    em.textContent=c.email||'';
    row.appendChild(nm);
    row.appendChild(em);
    list.appendChild(row);
  });

  // BCC
  var bcc=customers.map(function(c){return c.email;}).filter(Boolean).join(', ');
  document.getElementById('dlg-bcc').textContent=bcc;

  // Template
  document.getElementById('dlg-tpl').value=buildTemplate(size,color);

  // Delete btn
  document.getElementById('dlg-del').onclick=function(){deleteReqs(curIds);};

  document.getElementById('dlg').showModal();
}

function buildTemplate(taille, coloris){
  return 'Bonjour,\n\nBonne nouvelle !\n\nLe leurre souple RAVAGER coloris '+coloris+' taille '+taille+' vient d\'être réapprovisionné.\n\nIl ne reste que [NOMBRE] exemplaires en stock — première commande, première servie !\n\nNe tardez pas, ça part vite.\n\n👉 Commander maintenant : https://ravager-1041.myshopify.com\n\nBonne pêche,\nL\'équipe RAVAGER';
}

function copyBcc(){
  var t=document.getElementById('dlg-bcc').textContent;
  navigator.clipboard.writeText(t).then(function(){showToast('Emails copiés !');});
}

function copyTpl(){
  var t=document.getElementById('dlg-tpl').value;
  navigator.clipboard.writeText(t).then(function(){showToast('Message copié !');});
}

async function deleteReqs(ids){
  if(!ids.length)return;
  var btn=document.getElementById('dlg-del');
  btn.disabled=true;
  btn.textContent='Suppression...';
  try{
    await fetch(SB_URL+'/rest/v1/restock_requests?id=in.('+ids.join(',')+')',{
      method:'PATCH',
      headers:{
        'Content-Type':'application/json',
        'apikey':SB_KEY,
        'Authorization':'Bearer '+SB_KEY,
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({notifie:true,notifie_at:new Date().toISOString()})
    });
    showToast('Demandes supprimées !');
    document.getElementById('dlg').close();
    loadData();
  }catch(e){
    btn.disabled=false;
    btn.textContent='Supprimer ces demandes';
    showToast('Erreur — réessaye');
  }
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}
</script>
</body>
</html>
